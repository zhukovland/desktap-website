  <!-- Holding page: the home page while the site is being reworked -->
  <style>
    .soon {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: 0 32px;
    }

    .soon-head {
      height: 56px;
      display: flex;
      align-items: center;
      animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }
    .soon-head .nav-logo { color: var(--text-primary); }

    .soon-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 64px 0;
      position: relative;
    }
    /* A still, faint aura behind the text: no moving background */
    .soon-main::before {
      content: '';
      position: absolute;
      left: -20%;
      top: 50%;
      width: 140%;
      height: 120%;
      transform: translateY(-50%);
      background: radial-gradient(closest-side, var(--accent-subtle), transparent);
      pointer-events: none;
      z-index: -1;
    }


    .soon-main h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(2.75rem, 9vw, 4.5rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
      margin-bottom: 20px;
    }

    .soon-lede {
      font-size: clamp(1.0625rem, 2.4vw, 1.25rem);
      line-height: 1.55;
      color: var(--text-secondary);
      max-width: 34em;
      margin-bottom: 40px;
    }

    .soon-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      list-style: none;
    }
    .soon-links a {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 16px;
      font-size: 0.875rem;
      color: var(--text-primary);
      border: 1px solid var(--border-hover);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.02);
      transition: border-color 0.2s, background 0.2s;
    }
    .soon-links a:hover {
      border-color: rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.05);
    }
    .soon-links .soon-mail { font-family: var(--mono); font-size: 0.8125rem; }

    .soon-main h1     { animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
    .soon-lede        { animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
    .soon-links       { animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; }

    .soon-foot {
      padding: 24px 0;
      font-size: 0.8125rem;
      color: var(--text-tertiary);
    }

    @media (max-width: 768px) {
      .soon { padding: 0 20px; }
      .soon-main { padding: 40px 0; }
    }
  </style>
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <div class="soon">
    <header class="soon-head">
      <span class="nav-logo">
        <img src="/assets/icon-96.png" alt="" width="28" height="28">
        desktap
      </span>
    </header>

    <main class="soon-main" id="main">
      <h1>Coming soon</h1>
      <p class="soon-lede">Desktap turns your iPhone or iPad into a control deck for your Mac. We're getting it ready for launch.</p>
      <ul class="soon-links">
        <li><a href="/docs">Docs</a></li>
        <li><a href="/privacy">Privacy</a></li>
        <li><a href="/terms">Terms</a></li>
        <li><a class="soon-mail" href="mailto:support@desktap.app">support@desktap.app</a></li>
      </ul>
    </main>

    <footer class="soon-foot">&copy; 2026 Desktap</footer>
  </div>

</body>
</html>
